<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel do Aluno</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- TOPO AZUL MODERNO -->
<header class="header-aluno">
    <div class="foto-nome-area">
        <img id="fotoAluno" src="icone-de-perfil-de-usuario-em-estilo-plano-ilustracao-em-vetor-avatar-membro-em-fundo-isolado-conceito-de-negocio-de-sinal-de-permissao-humana_157943-15752.avif" alt="Foto do aluno">
        <h1 id="nome"></h1>
    </div>
</header>

<!-- CONTEÚDO DO PAINEL -->
<div class="painel-wrapper">

    <!-- CARD DE INFORMAÇÕES DO ALUNO -->
    <div class="card info-card">
        <h2>Informações do Aluno</h2>

        <p><b>Usuário:</b> <span id="usuario"></span></p>
        <p><b>Matrícula:</b> <span id="matricula"></span></p>
        <p><b>Turma:</b> <span id="turma"></span></p>
        <p><b>Turno:</b> <span id="turno"></span></p>
    </div>

    <!-- CARD DE NOTAS -->
    <div class="card notas-card">
        <h2>Notas do Aluno</h2>

        <div class="nota-item">
            <h3>Matemática</h3>
            <p>Nota: <span id="notaMatematica"></span></p>
        </div>

        <div class="nota-item">
            <h3>Português</h3>
            <p>Nota: <span id="notaPortugues"></span></p>
        </div>

        <div class="nota-item">
            <h3>História</h3>
            <p>Nota: <span id="notaHistoria"></span></p>
        </div>
    </div>
</div>

<!-- BOTÃO SAIR -->
<div class="sair-area">
    <button onclick="logout()" class="logout">Sair</button>
</div>

<script>
const aluno = JSON.parse(localStorage.getItem("alunoLogado"));

if(!aluno){
    window.location.href = "login.html";
}

document.getElementById("nome").innerText = "Bem-vindo, " + aluno.nome;
document.getElementById("usuario").innerText = aluno.usuario;
document.getElementById("matricula").innerText = aluno.matricula;
document.getElementById("turma").innerText = aluno.turma;
document.getElementById("turno").innerText = aluno.turno;

// Notas fictícias
document.getElementById("notaMatematica").innerText = aluno.notas?.matematica || "8.7";
document.getElementById("notaPortugues").innerText = aluno.notas?.portugues || "9.2";
document.getElementById("notaHistoria").innerText = aluno.notas?.historia || "7.8";

function logout(){
    localStorage.removeItem("alunoLogado");
    window.location.href = "login.html";
}
</script>

</body>
</html>
