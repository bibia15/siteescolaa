<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel do Aluno</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="painel-container">
    <div class="painel-topo">
    <div class="foto-box">
        <img src="img/aluno.jpg" alt="Foto do aluno">
    </div>

    <div class="bemvindo-box">
        <h1 id="nome"></h1>
        <p id="usuarioTexto"></p>
    </div>
</div>

<div class="info-cards">
    <div class="info-card">
        <h3>Matrícula</h3>
        <p id="matricula"></p>
    </div>

    <div class="info-card">
        <h3>Turma</h3>
        <p id="turma"></p>
    </div>

    <div class="info-card">
        <h3>Turno</h3>
        <p id="turno"></p>
    </div>
</div>

<h2 class="titulo-notas">Notas do Aluno</h2>

<div class="notas-container">
    <div class="nota-card">
        <h3>Matemática</h3>
        <p>Nota: <b>8.7</b></p>
    </div>

    <div class="nota-card">
        <h3>Português</h3>
        <p>Nota: <b>9.2</b></p>
    </div>

    <div class="nota-card">
        <h3>História</h3>
        <p>Nota: <b>8.0</b></p>
    </div>

    <div class="nota-card">
        <h3>Ciências</h3>
        <p>Nota: <b>9.5</b></p>
    </div>
</div>

<button onclick="logout()" class="logout">Sair</button>

    <div class="info">
        <p><b>Usuário:</b> <span id="usuario"></span></p>
        <p><b>Matrícula:</b> <span id="matricula"></span></p>
        <p><b>Turma:</b> <span id="turma"></span></p>
        <p><b>Turno:</b> <span id="turno"></span></p>
    </div>

    <button onclick="logout()" class="logout">Sair</button>
</div>

<script>
const aluno = JSON.parse(localStorage.getItem("alunoLogado"));

if(!aluno){
    window.location.href = "login.html";
}

document.getElementById("nome").innerText = "Bem-vindo, " + aluno.nome;
document.getElementById("usuarioTexto").innerText = "Usuário: " + aluno.usuario; 
document.getElementById("usuario").innerText = aluno.usuario;
document.getElementById("matricula").innerText = aluno.matricula;
document.getElementById("turma").innerText = aluno.turma;
document.getElementById("turno").innerText = aluno.turno;

function logout(){
    localStorage.removeItem("alunoLogado");
    window.location.href = "login.html";
}
</script>

</body>
</html>
